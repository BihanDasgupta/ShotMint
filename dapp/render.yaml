services:
  # Backend Service (for Render deployment)
  # Note: Frontend is deployed on Vercel (see DEPLOYMENT.md)
  - type: web
    name: shotmint-backend
    runtime: python
    plan: free
    rootDir: dapp/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
        sync: false
        # Update this to your Vercel frontend URL after deployment

